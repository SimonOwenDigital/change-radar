Connection</text><text x="85.0" y="617.15" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1F3A5F" text-anchor="middle">owner</text><rect x="185" y="10" width="256" height="32" rx="6" fill="#F4F6F8" stroke="#D5DBE1" stroke-width="1"/><text x="313.0" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1F3A5F" text-anchor="middle">Prepare</text><rect x="465" y="10" width="396" height="32" rx="6" fill="#F4F6F8" stroke="#D5DBE1" stroke-width="1"/><text x="663.0" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1F3A5F" text-anchor="middle">Install the core</text><rect x="885" y="10" width="396" height="32" rx="6" fill="#F4F6F8" stroke="#D5DBE1" stroke-width="1"/><text x="1083.0" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1F3A5F" text-anchor="middle">Data and alerts</text><rect x="1305" y="10" width="256" height="32" rx="6" fill="#F4F6F8" stroke="#D5DBE1" stroke-width="1"/><text x="1433.0" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1F3A5F" text-anchor="middle">Open up and check</text><rect x="185" y="236" width="116" height="112" rx="10" fill="#ffffff" stroke="#2F8A5E" stroke-width="1.6"/><text x="243.0" y="268.9925" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#22303C" text-anchor="middle">1. Environment</text><text x="243.0" y="290.1675" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Dedicated, with</text><text x="243.0" y="308.64750000000004" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Dataverse; DLP</text><text x="243.0" y="327.1275" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">and credits</text><rect x="325" y="76" width="116" height="112" rx="10" fill="#ffffff" stroke="#6A58A8" stroke-width="1.6"/><text x="383.0" y="108.9925" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#22303C" text-anchor="middle">2. Reader app</text><text x="383.0" y="130.16750000000002" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Key Vault and</text><text x="383.0" y="148.6475" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">certificate;</text><text x="383.0" y="167.12750000000003" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Graph consent</text><rect x="465" y="546" width="116" height="112" rx="10" fill="#ffffff" stroke="#C9922E" stroke-width="1.6"/><text x="523.0" y="578.9925" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#22303C" text-anchor="middle">3. Connections</text><text x="523.0" y="600.1675" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Dataverse and</text><text x="523.0" y="618.6475" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Power Platform</text><text x="523.0" y="637.1275" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">for Admins V2</text><rect x="605" y="236" width="116" height="112" rx="10" fill="#ffffff" stroke="#2F8A5E" stroke-width="1.6"/><text x="663.0" y="278.23249999999996" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#22303C" text-anchor="middle">3. Import Core</text><text x="663.0" y="299.40749999999997" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Managed, with a</text><text x="663.0" y="317.8875" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">settings file</text><rect x="745" y="236" width="116" height="112" rx="10" fill="#ffffff" stroke="#2F8A5E" stroke-width="1.6"/><text x="803.0" y="268.9925" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#22303C" text-anchor="middle">4. Reader user</text><text x="803.0" y="290.1675" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Application</text><text x="803.0" y="308.64750000000004" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">user with the</text><text x="803.0" y="327.1275" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Reader role</text><rect x="885" y="236" width="116" height="112" rx="10" fill="#ffffff" stroke="#2F8A5E" stroke-width="1.6"/><text x="943.0" y="268.9925" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#22303C" text-anchor="middle">5. Seed data</text><text x="943.0" y="290.1675" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Settings,</text><text x="943.0" y="308.64750000000004" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">vocabulary,</text><text x="943.0" y="327.1275" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">rules, feeds</text><rect x="1025" y="546" width="116" height="112" rx="10" fill="#ffffff" stroke="#C9922E" stroke-width="1.6"/><text x="1083.0" y="588.2325" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#22303C" text-anchor="middle">6. Connections</text><text x="1083.0" y="609.4075" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Teams; Outlook</text><text x="1083.0" y="627.8875" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">for email</text><rect x="1165" y="236" width="116" height="112" rx="10" fill="#ffffff" stroke="#2F8A5E" stroke-width="1.6"/><text x="1223.0" y="268.9925" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#22303C" text-anchor="middle">6. Handlers</text><text x="1223.0" y="290.1675" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Import, then</text><text x="1223.0" y="308.64750000000004" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Set-Handlers</text><text x="1223.0" y="327.1275" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">turns them on</text><rect x="1305" y="236" width="116" height="112" rx="10" fill="#ffffff" stroke="#2F8A5E" stroke-width="1.6"/><text x="1363.0" y="268.9925" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#22303C" text-anchor="middle">7. People</text><text x="1363.0" y="290.1675" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Share the app;</text><text x="1363.0" y="308.64750000000004" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">User or Admin</text><text x="1363.0" y="327.1275" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">role</text><rect x="1445" y="236" width="116" height="112" rx="10" fill="#ffffff" stroke="#2F8A5E" stroke-width="1.6"/><text x="1503.0" y="278.23249999999996" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#22303C" text-anchor="middle">9. Check</text><text x="1503.0" y="299.40749999999997" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Test-Install,</text><text x="1503.0" y="317.8875" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">or by hand</text><path d="M301,292.0 L313.0,292.0 L313.0,132.0 L325,132.0" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow1F3A5F)" stroke-linejoin="round"/><path d="M441,132.0 L453.0,132.0 L453.0,602.0 L465,602.0" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow1F3A5F)" stroke-linejoin="round"/><path d="M581,602.0 L593.0,602.0 L593.0,292.0 L605,292.0" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow1F3A5F)" stroke-linejoin="round"/><path d="M721,292.0 L745,292.0" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow1F3A5F)" stroke-linejoin="round"/><path d="M861,292.0 L885,292.0" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow1F3A5F)" stroke-linejoin="round"/><path d="M1001,292.0 L1013.0,292.0 L1013.0,602.0 L1025,602.0" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow1F3A5F)" stroke-linejoin="round"/><path d="M1141,602.0 L1153.0,602.0 L1153.0,292.0 L1165,292.0" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow1F3A5F)" stroke-linejoin="round"/><path d="M1281,292.0 L1305,292.0" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow1F3A5F)" stroke-linejoin="round"/><path d="M1421,292.0 L1445,292.0" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow1F3A5F)" stroke-linejoin="round"/><rect x="1375.0" y="392" width="116" height="100" rx="10" fill="#ffffff" stroke="#2F8A5E" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1433.0" y="428.23249999999996" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#22303C" text-anchor="middle">8. Optional</text><text x="1433.0" y="449.40749999999997" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Ask, email,</text><text x="1433.0" y="467.8875" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">demo data</text><path d="M1363.0,348 L1363.0,442 L1375.0,442" fill="none" stroke="#5B6773" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow5B6773)" stroke-linejoin="round"/><path d="M1491.0,442 L1503.0,442 L1503.0,348" fill="none" stroke="#5B6773" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow5B6773)" stroke-linejoin="round"/><text x="800" y="722" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#5B6773" text-anchor="middle">Every setup script plans by default, writes only with -Apply, and refuses any environment but the one named.</text><text x="800" y="750" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#5B6773" text-anchor="middle">Plan for about half a day, most of it waiting for consent and the first runs.</text></svg>
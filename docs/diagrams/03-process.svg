t-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#5B6773" text-anchor="start">AI prompt</text><rect x="468.65" y="975" width="26" height="18" rx="4" fill="#ffffff" stroke="#C9922E" stroke-width="1.5"/><text x="502.65" y="989" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#5B6773" text-anchor="start">People</text><rect x="573.2" y="975" width="26" height="18" rx="4" fill="#ffffff" stroke="#C9922E" stroke-width="1.5" stroke-dasharray="6 4"/><text x="607.2" y="989" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#5B6773" text-anchor="start">Feedback</text></svg>
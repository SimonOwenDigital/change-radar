<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>The change management process, by role</title><defs><marker id="arrow3C78B4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3C78B4"/></marker><marker id="arrowC9922E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9922E"/></marker><marker id="arrow8A4FB0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A4FB0"/></marker><marker id="arrow2F8A5E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F8A5E"/></marker><marker id="arrow8A96A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A96A3"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="0" y="20" width="1600" height="140" rx="0" fill="#F1F3F5" stroke="#D5DBE1" stroke-width="1"/><rect x="0" y="20" width="190" height="140" rx="0" fill="#ffffff" fill-opacity="0.55" stroke="#D5DBE1" stroke-width="1"/><text x="95.0" y="95.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1F3A5F" text-anchor="middle">Microsoft</text><rect x="0" y="160" width="1600" height="250" rx="0" fill="#DDF1E7" stroke="#D5DBE1" stroke-width="1"/><rect x="0" y="160" width="190" height="250" rx="0" fill="#ffffff" fill-opacity="0.55" stroke="#D5DBE1" stroke-width="1"/><text x="95.0" y="280.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1F3A5F" text-anchor="middle">Change Radar</text><text x="95.0" y="300.15" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1F3A5F" text-anchor="middle">(automated)</text><rect x="0" y="410" width="1600" height="230" rx="0" fill="#FBEBCF" stroke="#D5DBE1" stroke-width="1"/><rect x="0" y="410" width="190" height="230" rx="0" fill="#ffffff" fill-opacity="0.55" stroke="#D5DBE1" stroke-width="1"/><text x="95.0" y="520.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1F3A5F" text-anchor="middle">Platform owner</text><text x="95.0" y="540.15" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1F3A5F" text-anchor="middle">and admins</text><rect x="0" y="640" width="1600" height="190" rx="0" fill="#FDF4E3" stroke="#D5DBE1" stroke-width="1"/><rect x="0" y="640" width="190" height="190" rx="0" fill="#ffffff" fill-opacity="0.55" stroke="#D5DBE1" stroke-width="1"/><text x="95.0" y="730.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1F3A5F" text-anchor="middle">Solution owners</text><text x="95.0" y="750.15" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1F3A5F" text-anchor="middle">and makers</text><rect x="0" y="830" width="1600" height="140" rx="0" fill="#DCEAF7" stroke="#D5DBE1" stroke-width="1"/><rect x="0" y="830" width="190" height="140" rx="0" fill="#ffffff" fill-opacity="0.55" stroke="#D5DBE1" stroke-width="1"/><text x="95.0" y="905.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1F3A5F" text-anchor="middle">Leadership</text><text x="300" y="14" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#5B6773" text-anchor="middle">As it happens</text><text x="840" y="14" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#5B6773" text-anchor="middle">Nightly, 04:00 to 07:00 UTC</text><text x="1150" y="14" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#5B6773" text-anchor="middle">Each working day</text><text x="1470" y="14" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#5B6773" text-anchor="middle">Weekly</text><rect x="215" y="42" width="168" height="96" rx="10" fill="#ffffff" stroke="#8A96A3" stroke-width="1.6"/><text x="299.0" y="77.715" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#22303C" text-anchor="middle">Publishes a change</text><text x="299.0" y="97.915" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Message Center post,</text><text x="299.0" y="115.075" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">roadmap item, incident</text><rect x="215" y="232" width="168" height="96" rx="10" fill="#ffffff" stroke="#2F8A5E" stroke-width="1.6"/><text x="299.0" y="267.71500000000003" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#22303C" text-anchor="middle">Collect</text><text x="299.0" y="287.915" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Signals and the estate;</text><text x="299.0" y="305.07500000000005" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">incidents every 15 min</text><rect x="410" y="232" width="168" height="96" rx="10" fill="#EFE3F7" stroke="#8A4FB0" stroke-width="1.6"/><text x="494.0" y="267.71500000000003" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#22303C" text-anchor="middle">Fingerprint</text><text x="494.0" y="287.915" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">What each new or</text><text x="494.0" y="305.07500000000005" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">changed signal touches</text><rect x="605" y="232" width="168" height="96" rx="10" fill="#ffffff" stroke="#2F8A5E" stroke-width="1.6"/><text x="689.0" y="267.71500000000003" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#22303C" text-anchor="middle">Match</text><text x="689.0" y="287.915" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Each fingerprint against</text><text x="689.0" y="305.07500000000005" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">every asset (rules)</text><rect x="800" y="232" width="168" height="96" rx="10" fill="#EFE3F7" stroke="#8A4FB0" stroke-width="1.6"/><text x="884.0" y="267.71500000000003" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#22303C" text-anchor="middle">Rate</text><text x="884.0" y="287.915" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Generic and estate</text><text x="884.0" y="305.07500000000005" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">impact</text><rect x="995" y="232" width="168" height="96" rx="10" fill="#ffffff" stroke="#2F8A5E" stroke-width="1.6"/><text x="1079.0" y="267.71500000000003" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#22303C" text-anchor="middle">Raise events</text><text x="1079.0" y="287.915" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Dispatch to the</text><text x="1079.0" y="305.07500000000005" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">handlers that are on</text><rect x="1395" y="232" width="168" height="96" rx="10" fill="#ffffff" stroke="#2F8A5E" stroke-width="1.6"/><text x="1479.0" y="267.71500000000003" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#22303C" text-anchor="middle">Weekly digest</text><text x="1479.0" y="287.915" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Monday: the week&#x27;s</text><text x="1479.0" y="305.07500000000005" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">changes, exposures</text><rect x="410" y="470" width="168" height="96" rx="10" fill="#ffffff" stroke="#C9922E" stroke-width="1.6"/><text x="494.0" y="505.715" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#22303C" text-anchor="middle">Review fingerprints</text><text x="494.0" y="525.915" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Below the confidence</text><text x="494.0" y="543.0749999999999" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">threshold</text><rect x="800" y="470" width="168" height="96" rx="10" fill="#ffffff" stroke="#C9922E" stroke-width="1.6"/><text x="884.0" y="505.715" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#22303C" text-anchor="middle">Triage the Radar</text><text x="884.0" y="525.915" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Confirm or dismiss;</text><text x="884.0" y="543.0749999999999" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">override a rating</text><rect x="995" y="470" width="168" height="96" rx="10" fill="#ffffff" stroke="#C9922E" stroke-width="1.6"/><text x="1079.0" y="505.715" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#22303C" text-anchor="middle">Receive cards</text><text x="1079.0" y="525.915" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Incidents, High or</text><text x="1079.0" y="543.0749999999999" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Critical, deadlines</text><rect x="1190" y="470" width="168" height="96" rx="10" fill="#ffffff" stroke="#C9922E" stroke-width="1.6"/><text x="1274.0" y="505.715" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#22303C" text-anchor="middle">Decide and assign</text><text x="1274.0" y="525.915" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Who acts, by when,</text><text x="1274.0" y="543.0749999999999" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">and who to tell</text><rect x="215" y="470" width="168" height="96" rx="10" fill="#ffffff" stroke="#C9922E" stroke-width="1.6"/><text x="299.0" y="505.715" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#22303C" text-anchor="middle">Tune</text><text x="299.0" y="525.915" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Vocabulary, rules,</text><text x="299.0" y="543.0749999999999" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">feeds, caps</text><rect x="1190" y="685" width="168" height="96" rx="10" fill="#ffffff" stroke="#C9922E" stroke-width="1.6"/><text x="1274.0" y="720.715" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#22303C" text-anchor="middle">Remediate</text><text x="1274.0" y="740.9150000000001" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Update the flow, move the</text><text x="1274.0" y="758.075" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">model, change a setting</text><rect x="995" y="685" width="168" height="96" rx="10" fill="#ffffff" stroke="#C9922E" stroke-width="1.6"/><text x="1079.0" y="720.715" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#22303C" text-anchor="middle">Ask Change Radar</text><text x="1079.0" y="740.9150000000001" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">What does this change</text><text x="1079.0" y="758.075" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">mean for my apps?</text><rect x="1395" y="685" width="168" height="96" rx="10" fill="#ffffff" stroke="#C9922E" stroke-width="1.6"/><text x="1479.0" y="720.715" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#22303C" text-anchor="middle">Confirm it&#x27;s done</text><text x="1479.0" y="740.9150000000001" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">The exposure closes</text><text x="1479.0" y="758.075" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">at the next match</text><rect x="1395" y="862" width="168" height="96" rx="10" fill="#ffffff" stroke="#3C78B4" stroke-width="1.6"/><text x="1479.0" y="897.715" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#22303C" text-anchor="middle">Read the digest</text><text x="1479.0" y="917.9150000000001" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">Priority matrix and</text><text x="1479.0" y="935.075" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="middle">what lands when</text><path d="M299,138 L299,232" fill="none" stroke="#8A96A3" stroke-width="2" marker-end="url(#arrow8A96A3)" stroke-linejoin="round"/><path d="M383,280 L410,280" fill="none" stroke="#2F8A5E" stroke-width="2" marker-end="url(#arrow2F8A5E)" stroke-linejoin="round"/><path d="M578,280 L605,280" fill="none" stroke="#2F8A5E" stroke-width="2" marker-end="url(#arrow2F8A5E)" stroke-linejoin="round"/><path d="M773,280 L800,280" fill="none" stroke="#2F8A5E" stroke-width="2" marker-end="url(#arrow2F8A5E)" stroke-linejoin="round"/><path d="M968,280 L995,280" fill="none" stroke="#2F8A5E" stroke-width="2" marker-end="url(#arrow2F8A5E)" stroke-linejoin="round"/><path d="M494,328 L494,470" fill="none" stroke="#8A4FB0" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow8A4FB0)" stroke-linejoin="round"/><rect x="437.915" y="384.5" width="112.17" height="23.55" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="494" y="400.0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#5B6773" text-anchor="middle">low confidence</text><path d="M884,328 L884,470" fill="none" stroke="#2F8A5E" stroke-width="2" marker-end="url(#arrow2F8A5E)" stroke-linejoin="round"/><rect x="831.4925" y="376.5" width="105.015" height="41.1" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="884" y="392.0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#5B6773" text-anchor="middle">exposures and</text><text x="884" y="409.55" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#5B6773" text-anchor="middle">ratings</text><path d="M1079,328 L1079,470" fill="none" stroke="#2F8A5E" stroke-width="2" marker-end="url(#arrow2F8A5E)" stroke-linejoin="round"/><rect x="1058.69" y="384.5" width="40.620000000000005" height="23.55" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="1079" y="400.0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#5B6773" text-anchor="middle">card</text><path d="M1163,518 L1190,518" fill="none" stroke="#C9922E" stroke-width="2" marker-end="url(#arrowC9922E)" stroke-linejoin="round"/><path d="M1274,566 L1274,685" fill=